<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1a222c"/>
      <stop offset="100%" stop-color="#0e131a"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- graph-paper grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5">
    <line x1="96"  y1="64" x2="96"  y2="448"/>
    <line x1="186" y1="64" x2="186" y2="448"/>
    <line x1="276" y1="64" x2="276" y2="448"/>
    <line x1="366" y1="64" x2="366" y2="448"/>
    <line x1="64"  y1="128" x2="448" y2="128"/>
    <line x1="64"  y1="208" x2="448" y2="208"/>
    <line x1="64"  y1="288" x2="448" y2="288"/>
    <line x1="64"  y1="368" x2="448" y2="368"/>
  </g>

  <!-- residuals: data point to fitted curve -->
  <g stroke="#4fd1c5" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round">
    <line x1="140" y1="310" x2="140" y2="341"/>
    <line x1="192" y1="330" x2="192" y2="298"/>
    <line x1="250" y1="228" x2="250" y2="259"/>
    <line x1="312" y1="222" x2="312" y2="196"/>
    <line x1="372" y1="145" x2="372" y2="174"/>
  </g>

  <!-- fitted function -->
  <path d="M 96,352 C 220,352 292,160 416,160"
        fill="none" stroke="#ff8a3d" stroke-width="16"
        stroke-linecap="round"/>

  <!-- observed data points -->
  <g fill="#4fd1c5" stroke="#0e131a" stroke-width="4">
    <circle cx="140" cy="310" r="14"/>
    <circle cx="192" cy="330" r="14"/>
    <circle cx="250" cy="228" r="14"/>
    <circle cx="312" cy="222" r="14"/>
    <circle cx="372" cy="145" r="14"/>
  </g>
</svg>
